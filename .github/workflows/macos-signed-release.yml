name: Privitty – macOS Signed DMG

# Produces a fully signed + notarized universal DMG for outside-App-Store
# distribution using the "Developer ID Application: Alanring Technologies
# Private Limited (9WB6484ZRW)" certificate.
#
# ── Required GitHub Secrets ──────────────────────────────────────────────────
# CSC_LINK             Base64-encoded Developer ID Application .p12 file.
#                      Export from Keychain Access → right-click the cert →
#                      "Export …" → choose .p12 → set a password.
#                      Then: base64 -i YourCert.p12 | pbcopy  (paste as secret)
#
# CSC_KEY_PASSWORD     Password you chose when exporting the .p12 above.
#
# APPLE_API_KEY_ID     10-char Key ID shown in App Store Connect →
#                      Users & Access → Integrations → App Store Connect API.
#
# APPLE_API_ISSUER     Issuer UUID on that same page.
#
# APPLE_API_KEY        Base64-encoded .p8 private key file.
#                      base64 -i AuthKey_<KEYID>.p8 | pbcopy
#
# ── Triggers ─────────────────────────────────────────────────────────────────
# • Push of a version tag:  git tag v1.2.3 && git push origin v1.2.3
# • Manual run via GitHub Actions UI
#
# ── Output ───────────────────────────────────────────────────────────────────
# Artifact: privitty-macos-signed  →  PrivittyChat-<version>-universal.dmg
# If a matching GitHub Release exists the DMG is also uploaded to it.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g. 1.2.3). Leave blank to use package.json.'
        required: false
        default: ''

jobs:
  build-and-sign-mac:
    name: macOS – signed universal DMG
    runs-on: macos-latest

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── 2. Toolchain ─────────────────────────────────────────────────────────
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      # ── 3. Import signing certificate into a temporary keychain ──────────────
      #
      # We create a short-lived keychain so the cert is never written to the
      # runner's login keychain and is automatically cleaned up at the end of
      # the job via the "Remove keychain" step.
      - name: Import Developer ID certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          KEYCHAIN_PATH="$RUNNER_TEMP/privitty-sign.keychain-db"
          KEYCHAIN_PASS="$(openssl rand -hex 16)"
          CERT_PATH="$RUNNER_TEMP/DeveloperIDApp.p12"
          B64_PATH="$RUNNER_TEMP/DeveloperIDApp.b64"

          if [ -z "${CSC_LINK:-}" ]; then
            echo "ERROR: CSC_LINK secret is empty."
            exit 1
          fi

          # Write secret to a file first (avoids shell escaping issues with long values).
          # Strip accidental whitespace/newlines from copy-paste.
          printf '%s' "$CSC_LINK" | tr -d ' \n\r\t' > "$B64_PATH"

          # macOS runners use BSD base64 (-D), not GNU base64 (--decode).
          base64 -D -i "$B64_PATH" -o "$CERT_PATH"

          CERT_BYTES=$(wc -c < "$CERT_PATH" | tr -d ' ')
          echo "Decoded certificate size: ${CERT_BYTES} bytes"
          if [ "$CERT_BYTES" -lt 1000 ]; then
            echo "ERROR: Decoded .p12 is too small — CSC_LINK is likely invalid or truncated."
            echo "Re-encode with: base64 -i YourCert.p12 | tr -d '\\n' | pbcopy"
            exit 1
          fi

          # Normalize password: GitHub secret set to a single space means "no password".
          CERT_PASS="${CSC_KEY_PASSWORD:-}"
          CERT_PASS="$(printf '%s' "$CERT_PASS" | tr -d ' \n\r\t')"

          # Validate PKCS#12 before touching the keychain.
          if ! openssl pkcs12 -in "$CERT_PATH" -passin "pass:${CERT_PASS}" -noout 2>/dev/null; then
            echo "ERROR: CSC_LINK is not a valid .p12 (or CSC_KEY_PASSWORD is wrong)."
            echo "Export again from Keychain Access:"
            echo "  1. Open Keychain Access → login → My Certificates"
            echo "  2. Expand 'Developer ID Application: Alanring Technologies...'"
            echo "  3. Select BOTH the certificate AND its private key (child item)"
            echo "  4. File → Export Items… → Personal Information Exchange (.p12)"
            echo "  5. base64 -i exported.p12 | tr -d '\\n' | pbcopy"
            exit 1
          fi

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERT_PASS" \
            -T /usr/bin/codesign \
            -T /usr/bin/productbuild \
            -T /usr/bin/pkgbuild

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | tr -d '"')

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          echo ":: Available signing identities ::"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      # ── 4. Write App Store Connect API key for notarytool ────────────────────
      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail

          KEY_DIR="$RUNNER_TEMP/private_keys"
          mkdir -p "$KEY_DIR"
          KEY_PATH="$KEY_DIR/AuthKey_${APPLE_API_KEY_ID}.p8"
          B64_PATH="$RUNNER_TEMP/AuthKey.b64"
          printf '%s' "$APPLE_API_KEY" | tr -d ' \n\r\t' > "$B64_PATH"
          base64 -D -i "$B64_PATH" -o "$KEY_PATH"
          chmod 600 "$KEY_PATH"

          echo "API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          echo "Wrote API key to $KEY_PATH"

      # ── 5. Install dependencies (both arm64 + x64 for universal build) ───────
      - name: Install dependencies (both architectures)
        run: pnpm install --frozen-lockfile

      # ── 6. Version override (manual dispatch only) ───────────────────────────
      - name: Override version
        if: ${{ github.event.inputs.version != '' }}
        working-directory: packages/target-electron
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json','utf8'));
            p.version = '${{ github.event.inputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2));
          "

      # ── 7. Build JS/TS sources ───────────────────────────────────────────────
      - name: Build JS/TS sources
        run: pnpm -w build:electron

      # ── 8. Flatten node_modules (required by the monorepo patcher) ───────────
      - name: Flatten node_modules
        working-directory: packages/target-electron
        run: node ../../bin/writeFlatDependencies.js packages/target-electron node_modules

      # ── 9. Create universal fat binaries via lipo ────────────────────────────
      - name: Create universal fat binaries (lipo)
        working-directory: packages/target-electron
        run: node ./build/create-universal-bins.cjs

      # ── 10. Remove arch-specific packages so ASAR headers match exactly ───────
      - name: Pre-cleanup arch-specific packages
        working-directory: packages/target-electron
        run: |
          rm -rf \
            node_modules/@parcel/watcher-darwin-arm64 \
            node_modules/@parcel/watcher-darwin-x64 \
            node_modules/@parcel/watcher-linux-arm64 \
            node_modules/@parcel/watcher-linux-x64 \
            node_modules/@parcel/watcher-win32-arm64 \
            node_modules/@parcel/watcher-win32-ia32 \
            node_modules/@parcel/watcher-win32-x64 \
            node_modules/@privitty/stdio-rpc-server-darwin-arm64 \
            node_modules/@privitty/stdio-rpc-server-darwin-x64 \
            node_modules/@privitty/privitty-core-darwin-arm64 \
            node_modules/@privitty/privitty-core-darwin-x64 \
            node_modules/@privitty/privitty-core-linux-arm64 \
            node_modules/@privitty/privitty-core-linux-x64 \
            node_modules/@privitty/privitty-core-win32-arm64 \
            node_modules/@privitty/privitty-core-win32-x64 \
            || true
          echo "Remaining @parcel/watcher and @privitty packages:"
          ls node_modules/@parcel/  2>/dev/null || echo "  (none)"
          ls node_modules/@privitty/ 2>/dev/null || echo "  (none)"

      # ── 11. Generate electron-builder config (signed, universal) ──────────────
      - name: Generate electron-builder config (signed, universal)
        working-directory: packages/target-electron
        env:
          UNIVERSAL_BUILD: 'true'
          # CSC_IDENTITY_AUTO_DISCOVERY must NOT be 'false' so shouldSign = true
        run: node ./build/gen-electron-builder-config.js

      # ── 12. Build, sign, notarize, and staple the DMG ─────────────────────────
      #
      # electron-builder will:
      #   a) Code-sign the .app with the Developer ID cert
      #   b) Call afterSignHook.cjs which submits to Apple notary and waits
      #   c) Staple the notarization ticket to the .app
      #   d) Create the DMG (dmg.sign=false so only the app is signed, not the DMG itself)
      - name: Build signed universal DMG
        working-directory: packages/target-electron
        env:
          UNIVERSAL_BUILD: 'true'
          # electron-builder picks up CSC_LINK / CSC_KEY_PASSWORD from env
          CSC_LINK: ${{ secrets.CSC_LINK }}
          # If the .p12 was exported without a password, leave CSC_KEY_PASSWORD
          # empty (or set it to a single space in GitHub Secrets — both work).
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # Notarization — consumed by afterSignHook.cjs
          appleApiKeyId: ${{ secrets.APPLE_API_KEY_ID }}
          appleApiIssuer: ${{ secrets.APPLE_API_ISSUER }}
          # Point notarytool at the .p8 file we wrote in step 4
          appleApiKey: ${{ env.API_KEY_PATH }}
        run: |
          pnpm exec electron-builder \
            --config ./electron-builder.json5 \
            --mac dmg \
            --universal \
            --publish never

      # ── 13. Verify the signature ──────────────────────────────────────────────
      - name: Verify code signature
        working-directory: packages/target-electron
        run: |
          DMG=$(ls dist/*.dmg | head -1)
          echo "Verifying: $DMG"
          # Mount and check the .app inside
          hdiutil attach "$DMG" -mountpoint /tmp/privitty-verify -nobrowse -quiet
          APP=$(ls /tmp/privitty-verify/*.app | head -1)
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type exec --verbose "$APP"
          echo "✓ Signature and Gatekeeper assessment passed"
          hdiutil detach /tmp/privitty-verify -quiet || true

      # ── 14. Upload signed DMG artifact ────────────────────────────────────────
      - name: Upload signed DMG
        uses: actions/upload-artifact@v4
        with:
          name: privitty-macos-signed
          path: packages/target-electron/dist/*.dmg
          retention-days: 90

      # ── 15. Attach DMG to GitHub Release (when triggered by a version tag) ────
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/target-electron/dist/*.dmg
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 16. Remove temporary keychain (always runs, even on failure) ──────────
      - name: Remove temporary keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          # Remove the .p12 and .p8 temp files
          rm -f "$RUNNER_TEMP/DeveloperIDApp.p12" || true
          rm -rf "$RUNNER_TEMP/private_keys" || true
